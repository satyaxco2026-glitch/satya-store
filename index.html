<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Satya X Co.</title>
<script src="https://cdn.tailwindcss.com"></script>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Poppins', sans-serif; }

/* 🔥 animation */
.fade-in {
  animation: fade 1s ease-in;
}
@keyframes fade {
  from {opacity:0; transform: translateY(20px);}
  to {opacity:1; transform: translateY(0);}
}
</style>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body class="bg-black text-white">

<!-- NAV -->
<div class="flex justify-between items-center p-4 border-b">
  <div class="flex items-center gap-3">
    <img src="images/final logo.png" class="w-12 h-12">
    <h1 class="text-yellow-400 text-xl font-bold">Satya X Co</h1>
  </div>

  <input id="search" placeholder="Search..."
    class="p-2 text-black rounded w-40 md:w-64">
</div>

<!-- HERO -->
<div class="text-center py-16 fade-in">

  <h2 class="text-4xl md:text-6xl font-bold text-yellow-400">
    Upgrade Your Style 🚀
  </h2>

  <p class="text-gray-400 mt-4">
    Shoes • Sunglasses • Beauty • More
  </p>

  <button onclick="goShop()"
    class="bg-yellow-500 px-8 py-3 mt-6 text-black font-bold rounded hover:scale-105 transition">
    Shop Now
  </button>

</div>

<!-- CATEGORIES -->
<div class="p-6 fade-in">
  <h2 class="text-xl mb-4">Categories</h2>

  <div class="grid grid-cols-2 md:grid-cols-3 gap-4">

    <div onclick="goCat('sunglasses')" class="bg-gray-900 p-4 rounded hover:scale-105 transition cursor-pointer">
      <img src="https://images.unsplash.com/photo-1511499767150-a48a237f0083" class="rounded mb-2">
      <p class="text-center">Sunglasses</p>
    </div>

    <div onclick="goCat('shoes')" class="bg-gray-900 p-4 rounded hover:scale-105 transition cursor-pointer">
      <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" class="rounded mb-2">
      <p class="text-center">Shoes</p>
    </div>

    <div onclick="goCat('beauty')" class="bg-gray-900 p-4 rounded hover:scale-105 transition cursor-pointer">
      <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9" class="rounded mb-2">
      <p class="text-center">Beauty</p>
    </div>

  </div>
</div>

<!-- TRENDING -->
<div class="p-6 fade-in">
  <h2 class="text-xl mb-4">🔥 Trending</h2>

  <div id="preview" class="grid grid-cols-2 md:grid-cols-4 gap-4"></div>
</div>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAPUtC0xz_L8Sw3GZp7BiZBVbot1bXNaoo",
  authDomain: "satya-store-f8895.firebaseapp.com",
  projectId: "satya-store-f8895"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];

function loadProducts(){
  db.collection("PRODUCTS").get().then(snap=>{
    products = [];
    snap.forEach(doc=> products.push(doc.data()));
    show(products);
  });
}

function show(list){
  let c = document.getElementById("preview");
  c.innerHTML="";

  list.slice(0,8).forEach(p=>{
    c.innerHTML += `
      <div onclick="goShop()"
      class="bg-gray-900 p-2 rounded hover:scale-105 transition cursor-pointer">

        <img src="${p.images[0]}" class="rounded mb-2">
        <p class="text-sm">${p.name}</p>
        <p class="text-yellow-400 text-sm">₹${p.price}</p>

      </div>
    `;
  });
}

// SEARCH
search.oninput = ()=>{
  let val = search.value.toLowerCase();
  let filtered = products.filter(p =>
    p.name.toLowerCase().includes(val)
  );
  show(filtered);
};

function goShop(){
  location.href = "shop.html";
}

function goCat(cat){
  location.href = "shop.html?cat="+cat;
}

loadProducts();

</script>

</body>
</html>
